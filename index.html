<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Creator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <h1>🎵 AI Music Creator</h1>
    <p>Turn your ideas into songs</p>
  </header>

  <main>

    <section class="creator-card">
      <h2>✨ Create a Song</h2>

      <label for="songPrompt">Describe your song</label>

      <textarea
        id="songPrompt"
        placeholder="Example: A romantic Hindi pop song about missing someone, emotional vocals, beautiful piano and cinematic drums..."
      ></textarea>

      <div class="options">

        <div>
          <label for="genre">🎼 Genre</label>
          <select id="genre">
            <option>Pop</option>
            <option>Hip Hop</option>
            <option>R&B</option>
            <option>Rock</option>
            <option>Electronic</option>
            <option>Lo-fi</option>
            <option>Bollywood</option>
            <option>Classical</option>
          </select>
        </div>

        <div>
          <label for="mood">😊 Mood</label>
          <select id="mood">
            <option>Emotional</option>
            <option>Happy</option>
            <option>Sad</option>
            <option>Romantic</option>
            <option>Energetic</option>
            <option>Dark</option>
            <option>Peaceful</option>
          </select>
        </div>

        <div>
          <label for="language">🌍 Language</label>
          <select id="language">
            <option>English</option>
            <option>Hindi</option>
            <option>Manipuri</option>
            <option>Bengali</option>
            <option>Tamil</option>
            <option>Telugu</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label for="vocals">🎤 Vocals</label>
          <select id="vocals">
            <option>Female</option>
            <option>Male</option>
            <option>Duet</option>
            <option>Instrumental</option>
          </select>
        </div>

      </div>

      <button id="generateBtn" class="generate-btn">
        ✨ Generate Song
      </button>

      <div id="status" class="status"></div>

    </section>


    <section class="creator-card">
      <h2>📝 Lyrics</h2>

      <textarea
        id="lyrics"
        placeholder="Your song lyrics will appear here..."
      ></textarea>

      <div class="button-row">
        <button id="saveLyrics">💾 Save Lyrics</button>
        <button id="downloadLyrics">⬇️ Download Lyrics</button>
      </div>

    </section>


    <section class="creator-card">
      <h2>🎧 Your Song</h2>

      <div id="songResult" class="song-result">
        <p>Your generated song will appear here.</p>
      </div>

      <audio id="audioPlayer" controls></audio>

    </section>


    <section class="creator-card advanced">
      <h2>⚙️ Advanced Options</h2>

      <label for="tempo">Tempo (BPM)</label>
      <input id="tempo" type="number" value="100" min="40" max="220">

      <label for="style">Music style details</label>
      <input
        id="style"
        type="text"
        placeholder="Example: warm piano, deep bass, cinematic drums"
      >
    </section>

  </main>

  <footer>
    <p>🎵 AI Music Creator</p>
  </footer>

  <script src="script.js"></script>
</body>
  </html>
